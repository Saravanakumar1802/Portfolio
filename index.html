    <style>
      /* Paint the brand background and the loader's progress track before
         CSS/JS arrive; the React loader takes over at the same spot. */
      html,
      body {
        background: #0b1020;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        background:
          radial-gradient(40% 40% at 50% 45%, rgb(124 196 255 / 0.084), transparent 70%),
          radial-gradient(30% 30% at 58% 52%, rgb(232 54 79 / 0.084), transparent 70%), #0b1020;
      }
      #boot i {
        position: absolute;
        left: 50%;
        bottom: 9vh;
        width: min(18rem, 70vw);
        height: 3px;
        margin-left: max(-9rem, -35vw);
        border-radius: 999px;
        background: rgb(255 255 255 / 0.1);
        overflow: hidden;
      }
      #boot i::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent, #e8364f, transparent);
        transform: translateX(-100%);
        animation: boot 1.1s ease-in-out infinite;
      }
      @keyframes boot {
        to {
          transform: translateX(100%);
        }
      }
    </style>
    <noscript
      ><style>
        #boot {
          display: none;
        }
      </style></noscript
    >
  </head>
